<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <!-- flat rounded-square background, no glow -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- circular arrow ring -->
  <path d="M 128 46
           A 82 82 0 1 0 196 92"
        fill="none" stroke="url(#ring)" stroke-width="26"
        stroke-linecap="round"/>

  <!-- growth arrow inside the ring -->
  <path d="M 78 150 L 108 122 L 128 140 L 168 100"
        fill="none" stroke="#ffffff" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 140 100 L 168 100 L 168 128"
        fill="none" stroke="#ffffff" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- simple bell badge, solid fill, no rays/blur -->
  <circle cx="196" cy="60" r="38" fill="#f472b6" stroke="#ffffff" stroke-width="6"/>
  <path d="M196 42 c-10 0 -16 8 -16 18 v6 c0 6 -3 10 -6 13 h44
           c-3 -3 -6 -7 -6 -13 v-6 c0 -10 -6 -18 -16 -18 z"
        fill="#ffffff"/>
  <path d="M188 82 a8 8 0 0 0 16 0 z" fill="#ffffff"/>
</svg>
